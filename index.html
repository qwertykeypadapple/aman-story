<title>Aman Singh · The Story</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#f7f8fc;--card:#ffffff;--card2:#eef1f9;--ink:#0b1220;--muted:#5b6478;
  --accent:#4f46e5;--accent2:#9333ea;--gold:#f59e0b;--good:#10b981;--bad:#ef4444;
  --line:#e4e8f1;--dur:7s;
  --serif:"Instrument Serif",Georgia,serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit}

/* ---------- background map + veil ---------- */
#bg{position:fixed;inset:0;z-index:0;background:var(--bg)}
#bg .leaflet-tile-pane{filter:saturate(.7) contrast(.95)}
.veil{position:fixed;inset:0;z-index:1;pointer-events:none;transition:opacity 1s;
  background:linear-gradient(90deg,rgba(247,248,252,.98) 0%,rgba(247,248,252,.92) 34%,rgba(247,248,252,.4) 60%,rgba(247,248,252,0) 82%)}
.veil2{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0;transition:opacity 1s;
  background:radial-gradient(circle at 50% 46%,rgba(247,248,252,.94) 0%,rgba(247,248,252,.82) 45%,rgba(247,248,252,.6) 100%)}
body.cover .veil{opacity:0} body.cover .veil2{opacity:1}
@media (max-width:820px){
  .veil{background:linear-gradient(0deg,rgba(247,248,252,1) 0%,rgba(247,248,252,.94) 50%,rgba(247,248,252,.35) 72%,rgba(247,248,252,0) 88%)}
}
.pin{width:14px;height:14px;border-radius:50%;background:var(--accent);border:3px solid #fff;opacity:0;transform:scale(.3);transition:opacity .6s,transform .6s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 0 0 rgba(79,70,229,.45)}
.pin.on{opacity:1;transform:none;animation:pulse 2.2s infinite}
.pin.here{background:var(--accent2);width:18px;height:18px;margin:-2px}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(79,70,229,.45)}70%{box-shadow:0 0 0 18px rgba(79,70,229,0)}100%{box-shadow:0 0 0 0 rgba(79,70,229,0)}}

/* ---------- slides ---------- */
#stage{position:fixed;inset:0;z-index:2;cursor:pointer;user-select:none;-webkit-user-select:none}
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transform:translateX(60px);
  transition:opacity .8s ease,transform 1s cubic-bezier(.2,.8,.2,1),visibility 0s 1s}
.slide.past{transform:translateX(-60px)}
.slide.active{opacity:1;visibility:visible;transform:none;transition:opacity .8s ease,transform 1s cubic-bezier(.2,.8,.2,1),visibility 0s}
.content{position:absolute;left:max(7vw,24px);top:50%;transform:translateY(-50%);width:min(580px,calc(100% - 48px))}
@media (max-width:820px){.content{left:22px;right:22px;width:auto;top:auto;bottom:calc(96px + env(safe-area-inset-bottom));transform:none}}

.r,.title .w{opacity:0}
.slide.active .r{animation:rise .95s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.25s + var(--d,0)*.12s)}
.title .w{display:inline-block;margin-right:.2em}
.slide.active .title .w{animation:rise 1.05s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.4s + var(--i)*.09s)}
@keyframes rise{from{opacity:0;transform:translateY(30px);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}

.art{width:128px;height:128px;border-radius:50%;display:grid;place-items:center;font-size:64px;margin-bottom:22px;overflow:hidden;
  background:rgba(255,255,255,.8);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid #fff;
  box-shadow:0 24px 60px rgba(79,70,229,.18),inset 0 0 0 1px rgba(79,70,229,.06)}
.art span{display:block;animation:float 5s ease-in-out infinite}
.art .ico{width:50%;height:50%;fill:none;stroke:url(#ig);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;animation:float 5s ease-in-out infinite;overflow:visible}
.art .ico .dot{fill:url(#ig);stroke:none}
.art img{width:100%;height:100%;object-fit:cover}
.slide.active .art img{animation:kb 10s ease-out both}
@keyframes float{50%{transform:translateY(-8px) rotate(-5deg)}}
@keyframes kb{from{transform:scale(1.18)}to{transform:scale(1)}}
@media (max-width:820px){.art{width:92px;height:92px;font-size:46px;margin-bottom:16px}}

.ch{font-size:12px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--accent)}
.ch em{font-style:normal;color:var(--muted);letter-spacing:.12em}
.title{font-family:var(--serif);font-weight:400;font-size:clamp(46px,7.4vw,104px);line-height:.96;letter-spacing:-.015em;margin:12px 0 16px}
.title .acc{font-style:italic;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.06em}
.line{font-size:clamp(16px,1.5vw,19px);color:var(--muted);margin:0 0 24px;line-height:1.5;max-width:460px}
.stat{display:flex;align-items:baseline;gap:14px;margin-bottom:24px}
.stat b{font-family:var(--serif);font-weight:400;font-size:clamp(52px,6vw,80px);line-height:1;font-variant-numeric:tabular-nums;
  background:linear-gradient(90deg,var(--ink),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{color:var(--muted);font-size:14px;line-height:1.35;max-width:190px}
.cta{display:inline-flex;align-items:center;gap:8px;padding:13px 22px;border-radius:999px;border:0;cursor:pointer;font-weight:700;font-size:15px;color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 14px 34px rgba(79,70,229,.32);transition:transform .2s}
.cta:hover{transform:translateY(-2px)}
.cta.cleared{background:#fff;color:var(--ink);box-shadow:0 8px 24px rgba(11,18,32,.08);border:1px solid var(--line)}

.bigyear{position:absolute;right:4vw;bottom:5vh;font-family:var(--serif);font-size:clamp(120px,21vw,340px);line-height:.8;white-space:nowrap;pointer-events:none;
  color:transparent;-webkit-text-stroke:1.5px rgba(79,70,229,.2);opacity:0}
.slide.active .bigyear{animation:drift 2.4s cubic-bezier(.2,.8,.2,1) .2s both}
@keyframes drift{from{opacity:0;transform:translateX(80px)}to{opacity:1;transform:none}}
@media (max-width:820px){.bigyear{top:70px;bottom:auto;right:14px;font-size:32vw}}

/* cover */
.slide.cover .content{left:50%;top:50%;right:auto;bottom:auto;transform:translate(-50%,-50%);text-align:center;width:min(760px,calc(100% - 40px))}
.ring{width:156px;height:156px;margin:0 auto 26px;padding:4px;border-radius:50%;background:conic-gradient(from 200deg,var(--accent),var(--accent2),#f472b6,var(--accent));
  box-shadow:0 24px 70px rgba(79,70,229,.3)}
.ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:5px solid #fff;display:block}
.cover .title{font-size:clamp(64px,12vw,160px);margin:8px 0 10px}
.cover .line{margin:0 auto 34px;max-width:none}
.watch{position:relative;display:inline-flex;align-items:center;gap:12px;padding:18px 30px;border-radius:999px;border:0;cursor:pointer;font-weight:700;font-size:17px;color:#fff;
  background:var(--ink);box-shadow:0 18px 44px rgba(11,18,32,.25)}
.watch::before{content:"";position:absolute;inset:-6px;border-radius:999px;border:2px solid rgba(79,70,229,.35);animation:ringpulse 2s infinite}
@keyframes ringpulse{0%{transform:scale(.96);opacity:1}100%{transform:scale(1.12);opacity:0}}
.route{font-size:13px;color:var(--muted);letter-spacing:.08em;margin-top:26px}
.route b{color:var(--ink);font-weight:600}

/* finale */
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px}
.chips a{display:inline-flex;gap:8px;align-items:center;padding:12px 18px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:600;font-size:14px;box-shadow:0 8px 22px rgba(11,18,32,.06)}
.chips a:hover{border-color:var(--accent);color:var(--accent)}

/* ---------- HUD ---------- */
.bars{position:fixed;z-index:3;top:calc(12px + env(safe-area-inset-top));left:16px;right:16px;display:flex;gap:5px}
.seg{flex:1;height:3px;border-radius:3px;background:rgba(11,18,32,.12);overflow:hidden}
.seg i{display:block;height:100%;width:0;background:var(--ink);border-radius:3px}
.seg.done i{width:100%}
.seg.cur i{animation:fillbar var(--dur) linear forwards}
body.paused .seg.cur i{animation-play-state:paused}
@keyframes fillbar{from{width:0}to{width:100%}}
.meta{position:fixed;z-index:3;top:calc(26px + env(safe-area-inset-top));left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.logo{font-weight:800;letter-spacing:.26em;font-size:11px}
.hud{position:fixed;z-index:3;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:8px;align-items:center;
  padding:6px;border-radius:999px;background:rgba(255,255,255,.82);border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 12px 34px rgba(11,18,32,.1)}
.hud button{width:42px;height:42px;border-radius:50%;border:0;background:transparent;color:var(--ink);font-size:18px;cursor:pointer;display:grid;place-items:center}
.hud button:hover{background:var(--card2)}
.hud #pp{background:var(--ink);color:#fff;font-size:14px}
.hud .count{white-space:nowrap;font-size:12px;font-weight:600;color:var(--muted);padding:0 10px 0 4px;font-variant-numeric:tabular-nums}
body.cover .hud{opacity:0;pointer-events:none}
.hud{transition:opacity .6s}
.credit{position:fixed;z-index:3;right:12px;bottom:6px;font-size:10px;color:var(--muted);opacity:.7}

.hidden{display:none!important}

@media (prefers-reduced-motion:reduce){
  .slide,.slide.active{transition:opacity .3s}
  .slide.active .r,.slide.active .title .w,.slide.active .bigyear{animation-duration:.01s;animation-delay:0s}
  .art span,.watch::before,.pin.on{animation:none}
}
</style>
</head>

     stat:{from:0, n:40, pre:'₹', suf:'L', label:'raised from Govt. of India (AIC)'}},
  {ch:'Chapter 07', year:'2023',      title:'Quant at WorldQuant', line:'World Rank 151, Brain Challenge.', icon:'chart', z:3,
     stat:{from:0, n:90, suf:'+', label:'alphas built'}},
  {ch:'Chapter 08', year:'2024–26',   title:'Robots at KAIST, Korea', line:'Researcher. Robots that see, and follow people.', icon:'vision', ll:[36.3725,127.3604], z:8},
  {ch:'Chapter 09', year:'2026',      title:'Cleaning up space debris', line:'ESA × Kaggle machine-unlearning challenge. Solo.', icon:'orbit', z:2,
     stat:{from:567, n:4, pre:'#', label:'of 567 teams worldwide'}},
  {ch:'Chapter 10', year:'Now · Zürich', big:'Zürich', title:'The next chapter', line:'Let’s write it together.', img:PHOTO, ll:[47.3769,8.5417], z:6, finale:true}
];
const ICONS = {
  sprout:   '<path d="M12 21v-9"/><path d="M12 12C12 8 9 5 4 5c0 4 3 7 8 7z"/><path d="M12 10c0-3.5 2.5-6 7-6 0 3.5-2.5 6-7 6z"/><path d="M8 21h8"/>',
  book:     '<path d="M2 5h6a4 4 0 0 1 4 4v11a3 3 0 0 0-3-3H2z"/><path d="M22 5h-6a4 4 0 0 0-4 4v11a3 3 0 0 1 3-3h7z"/>',
  bolt:     '<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
  building: '<rect x="4" y="3" width="16" height="18" rx="1.5"/><path d="M9 7h.01M15 7h.01M9 11h.01M15 11h.01M9 15h.01M15 15h.01" stroke-width="2.2"/><path d="M10 21v-3h4v3"/>',
  terminal: '<rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="m7 9 3 3-3 3"/><path d="M13 15h4"/>',
  rocket:   '<path d="M12 15.5c-1.6-1.6-3-3.4-3-6.5 0-3.5 3-6.5 3-6.5s3 3 3 6.5c0 3.1-1.4 4.9-3 6.5z"/><path d="M9 11.5 6 13.5V18l3-2"/><path d="M15 11.5l3 2V18l-3-2"/><path d="M11 18.5c0 1.6 1 2.8 1 2.8s1-1.2 1-2.8"/><circle cx="12" cy="9" r="1.3"/>',
  chart:    '<path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 6-7"/><path d="M15 7h5v5"/>',
  vision:   '<path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/><path d="M6 12s2.5-4 6-4 6 4 6 4-2.5 4-6 4-6-4-6-4z"/><circle cx="12" cy="12" r="1.8"/>',
  orbit:    '<circle cx="12" cy="12" r="3"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(-25 12 12)"/><circle class="dot" cx="20.2" cy="7.6" r="1.4"/>'
};
const CONTACTS = [
  ['','Email','mailto:amanamals@alumni.iitd.ac.in'],
  ['','GitHub','https://github.com/qwertykeypadapple'],
  ['','Kaggle','https://kaggle.com/qwertykeypadapple']
];

/* ========================================================= */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let cur = 0, playing = false;
const LAST = S.length - 1;

/* ---------- build slides ---------- */
function titleHTML(t){
  const words = t.split(' ');
  return words.map((w,i)=>`<span class="w${i===words.length-1?' acc':''}" style="--i:${i}">${esc(w)}</span>`).join('');
}

function buildSlides(){
  const stage = $('#stage');
  S.forEach((s,i)=>{
    const el = document.createElement('section');
    el.className = 'slide' + (s.type==='cover' ? ' cover' : '');
    if(s.type==='cover'){
      el.innerHTML = `
        <div class="content">
          <div class="ring r" style="--d:0"><img src="${PHOTO}" alt="Aman Singh" onerror="this.parentNode.style.display='none'"></div>
          <div class="ch r" style="--d:1">A life in ten chapters</div>
          <h1 class="title">${titleHTML('Aman Singh')}</h1>
          <p class="line r" style="--d:4">Engineer · Researcher · Builder</p>
          <button class="watch r" style="--d:5" id="watch">▶&nbsp; Watch my story</button>
          <div class="route r" style="--d:7"><b>Prayagraj</b> → <b>Varanasi</b> → <b>Delhi</b> → <b>Daejeon</b> → <b>Zürich</b></div>
        </div>`;
    } else {
      const big = s.big || s.year;
      const art = s.img ? `<img src="${s.img}" alt="">` : `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">${ICONS[s.icon]||''}</svg>`;
      const stat = s.stat ? `<div class="stat r" style="--d:6"><b data-i="${i}">${esc((s.stat.pre||'')+s.stat.from+(s.stat.suf||''))}</b><span>${esc(s.stat.label)}</span></div>` : '';
      const action = s.finale
        ? `<div class="chips r" style="--d:6">${CONTACTS.map(([ic,t,h])=>`<a href="${h}" target="_blank" rel="noopener">${t} <span aria-hidden="true">↗</span></a>`).join('')}</div>
           <button class="cta r" style="--d:7" data-replay>↺ Watch again</button>`
        : '';
      el.innerHTML = `
        <div class="bigyear">${esc(big)}</div>
        <div class="content">
          <div class="art r" style="--d:0">${art}</div>
          <div class="ch r" style="--d:1">${esc(s.ch)} <em>· ${esc(s.year)}</em></div>
          <h2 class="title">${titleHTML(s.title)}</h2>
          <p class="line r" style="--d:5">${esc(s.line)}</p>
          ${stat}
          ${action}
        </div>`;
    }
    stage.appendChild(el);
    s.el = el;
  });
  const bars = $('#bars');
  S.forEach((s,i)=>{
    const seg = document.createElement('div'); seg.className='seg';
    const fill = document.createElement('i');
    fill.addEventListener('animationend', ()=>{ if(i===cur && playing) next(); });
    seg.appendChild(fill); bars.appendChild(seg); s.seg = seg;
  });
}

/* ---------- map ---------- */
let map = null, route = null;
function initMap(){
  if(typeof L === 'undefined') return;
  map = L.map('bg', {zoomControl:false, attributionControl:false, dragging:false, scrollWheelZoom:false,
    doubleClickZoom:false, boxZoom:false, keyboard:false, touchZoom:false, zoomSnap:0.25}).setView([30,80],3);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {maxZoom:10}).addTo(map);
  route = L.polyline([], {color:'#4f46e5', weight:2.5, opacity:.65, dashArray:'2 8', lineCap:'round'}).addTo(map);
  S.forEach(s=>{
    if(!s.ll) return;
    s.marker = L.marker(s.ll, {interactive:false, icon:L.divIcon({className:'', html:'<div class="pin"></div>', iconSize:[14,14], iconAnchor:[7,7]})}).addTo(map);
  });
}
function lastLL(i){ for(let k=i;k>=0;k--) if(S[k].ll) return S[k].ll; return [30,80]; }
function framed(ll, z){
  const p = map.project(ll, z);
  const off = innerWidth > 820 ? L.point(-innerWidth*0.2, 0) : L.point(0, innerHeight*0.2);
  return map.unproject(p.add(off), z);
}
function moveMap(i){
  if(!map) return;
  const s = S[i];
  const all = S.filter(t=>t.ll).map(t=>t.ll);
  if(s.type==='cover'){
    map.flyToBounds(all, {padding:[60,60], duration:2});
  } else {
    const ll = s.ll || lastLL(i);
    map.flyTo(framed(ll, s.z), s.z, {duration:2.6, easeLinearity:.15});
  }
  const pts = [];
  S.forEach((t,k)=>{
    if(!t.marker) return;
    const on = i===0 || k<=i;
    const pin = t.marker.getElement() && t.marker.getElement().firstChild;
    if(pin){ pin.classList.toggle('on', on); pin.classList.toggle('here', i!==0 && k===lastIdxWithLL(i)); }
    if(on) pts.push(t.ll);
  });
  route.setLatLngs(pts);
}
function lastIdxWithLL(i){ for(let k=i;k>=0;k--) if(S[k].ll) return k; return -1; }

/* ---------- counters ---------- */
function countUp(i){
  const s = S[i]; if(!s.stat) return;
  const el = s.el.querySelector('.stat b');
  const {from=0, n, pre='', suf=''} = s.stat;
  el.textContent = pre+from+suf;
  setTimeout(()=>{
    const t0 = performance.now(), dur = 1600;
    const f = now=>{
      if(cur!==i) return;
      const k = Math.min(1,(now-t0)/dur), e = 1-Math.pow(1-k,3);
      el.textContent = pre + Math.round(from + (n-from)*e) + suf;
      if(k<1) requestAnimationFrame(f);
    };
    requestAnimationFrame(f);
  }, 900);
}

/* ---------- navigation ---------- */
function setPlaying(v){
  playing = v;
  document.body.classList.toggle('paused', !v);
  $('#pp').textContent = v ? '❚❚' : '▶';
}
function go(i){
  i = Math.max(0, Math.min(LAST, i));
  cur = i;
  S.forEach((s,k)=>{
    s.el.classList.toggle('active', k===i);
    s.el.classList.toggle('past', k<i);
    s.seg.className = 'seg' + (k<i ? ' done' : '');
  });
  void S[i].seg.offsetWidth;
  S[i].seg.classList.add('cur');
  document.body.classList.toggle('cover', i===0);
  $('#count').textContent = String(i).padStart(2,'0') + ' / ' + String(LAST).padStart(2,'0');
  moveMap(i);
  countUp(i);
}
function next(){ if(cur<LAST) go(cur+1); else setPlaying(false); }
function prev(){ if(cur>1) go(cur-1); }
function start(){ setPlaying(true); go(1); }

/* ---------- input ---------- */
let sx=null, sy=0;
$('#stage').addEventListener('pointerdown', e=>{
  if(e.target.closest('button,a')){ sx=null; return; }
  sx=e.clientX; sy=e.clientY;
});
$('#stage').addEventListener('pointerup', e=>{
  if(sx===null) return;
  const dx=e.clientX-sx, dy=e.clientY-sy; sx=null;
  if(cur===0){ start(); return; }
  if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)){ dx<0 ? next() : prev(); return; }
  if(Math.abs(dx)<12 && Math.abs(dy)<12){ e.clientX < innerWidth*0.3 ? prev() : next(); }
});
$('#stage').addEventListener('click', e=>{
  if(e.target.closest('[data-replay]')){ start(); return; }
  if(e.target.closest('#watch')){ start(); }
});
$('#prev').onclick = prev;
$('#next').onclick = ()=>{ if(cur===0) start(); else next(); };
$('#pp').onclick = ()=>{ if(cur===0) start(); else setPlaying(!playing); };
addEventListener('keydown', e=>{
  if(e.key==='ArrowRight'){ cur===0 ? start() : next(); }
  else if(e.key==='ArrowLeft'){ prev(); }
  else if(e.key===' '){ e.preventDefault(); cur===0 ? start() : setPlaying(!playing); }
});
addEventListener('resize', ()=>{ if(map){ map.invalidateSize(); moveMap(cur); } });

/* ---------- boot ---------- */
buildSlides();
try { initMap(); } catch(e) { map = null; }
go(0);
</script>
</body>
</html>
